<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d0a"/>
      <stop offset="50%" stop-color="#0e1713"/>
      <stop offset="100%" stop-color="#070a08"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#53bdeb"/>
      <stop offset="50%" stop-color="#c8ff39"/>
      <stop offset="100%" stop-color="#c8ff39"/>
    </linearGradient>
    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8ff39" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8ff39" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#c8ff39" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
  </g>

  <!-- Central Dashboard Main Frame -->
  <rect x="60" y="50" width="1080" height="700" rx="24" fill="#0c1410" stroke="#25352a" stroke-width="1.5" opacity="0.95"/>
  <rect x="60" y="50" width="1080" height="700" rx="24" fill="none" stroke="#c8ff39" stroke-width="1" opacity="0.2"/>

  <!-- Window Header Bar -->
  <rect x="60" y="50" width="1080" height="60" rx="24" fill="#121d17"/>
  <rect x="60" y="90" width="1080" height="20" fill="#121d17"/>
  <line x1="60" y1="110" x2="1140" y2="110" stroke="#233428" stroke-width="1"/>
  
  <!-- Traffic Dots -->
  <circle cx="95" cy="80" r="6" fill="#ff5f56"/>
  <circle cx="115" cy="80" r="6" fill="#ffbd2e"/>
  <circle cx="135" cy="80" r="6" fill="#27c93f"/>

  <!-- Title / Breadcrumb -->
  <text x="165" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8ea293" letter-spacing="0.1em">MATRIX STUDIO // OPERATIONS &amp; CRM DASHBOARD</text>
  <rect x="940" y="68" width="160" height="26" rx="13" fill="#1b2a21" stroke="#c8ff39" stroke-width="0.8"/>
  <circle cx="955" cy="81" r="3.5" fill="#c8ff39" filter="url(#glow)"/>
  <text x="968" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#c8ff39" letter-spacing="0.08em">LIVE CLOUD SYNC</text>

  <!-- 3 Top Metric Cards -->
  <!-- Metric 1: Revenue -->
  <g transform="translate(90, 135)">
    <rect width="320" height="130" rx="16" fill="#101b15" stroke="#283a2d" stroke-width="1"/>
    <text x="22" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#8da392" letter-spacing="0.12em">TODAY'S REVENUE</text>
    <text x="22" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">PKR 184,500</text>
    <rect x="22" y="90" width="85" height="22" rx="11" fill="#1a2d21"/>
    <text x="32" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#c8ff39">▲ +24.8%</text>
    <text x="115" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#75887a">vs yesterday</text>
  </g>

  <!-- Metric 2: Orders Processed -->
  <g transform="translate(440, 135)">
    <rect width="320" height="130" rx="16" fill="#101b15" stroke="#283a2d" stroke-width="1"/>
    <text x="22" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#8da392" letter-spacing="0.12em">ORDERS PROCESSED</text>
    <text x="22" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">142 Orders</text>
    <text x="22" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#53bdeb">⚡ 100% Automated via WhatsApp</text>
  </g>

  <!-- Metric 3: Stock Health -->
  <g transform="translate(790, 135)">
    <rect width="320" height="130" rx="16" fill="#101b15" stroke="#283a2d" stroke-width="1"/>
    <text x="22" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#8da392" letter-spacing="0.12em">INVENTORY HEALTH</text>
    <text x="22" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#c8ff39" letter-spacing="-0.03em">98.4% Optimal</text>
    <text x="22" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8da392">0 Stockouts • Auto-alert Active</text>
  </g>

  <!-- Large Center Chart: Sales & Orders Surge -->
  <g transform="translate(90, 290)">
    <rect width="670" height="430" rx="18" fill="#101a14" stroke="#26382c" stroke-width="1"/>
    
    <!-- Chart Header -->
    <text x="26" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Real-Time Revenue Trend</text>
    <text x="26" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#758a7b">Live synchronised order feed (Hourly)</text>

    <g transform="translate(530, 24)">
      <rect width="115" height="26" rx="13" fill="#18271e" stroke="#354a3a" stroke-width="0.8"/>
      <text x="16" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#c8ff39">LAST 24 HOURS</text>
    </g>

    <!-- Chart Gridlines -->
    <g stroke="#1d2d22" stroke-width="1" stroke-dasharray="3 3">
      <line x1="26" y1="100" x2="640" y2="100"/>
      <line x1="26" y1="160" x2="640" y2="160"/>
      <line x1="26" y1="220" x2="640" y2="220"/>
      <line x1="26" y1="280" x2="640" y2="280"/>
      <line x1="26" y1="340" x2="640" y2="340"/>
    </g>

    <!-- Chart Area Fill -->
    <path d="M 40 330 Q 120 310, 180 270 T 320 220 T 440 150 T 560 110 T 630 85 L 630 350 L 40 350 Z" fill="url(#chartArea)"/>

    <!-- Chart Line -->
    <path d="M 40 330 Q 120 310, 180 270 T 320 220 T 440 150 T 560 110 T 630 85" fill="none" stroke="url(#limeGrad)" stroke-width="3.5" filter="url(#glow)"/>

    <!-- Data Pin -->
    <circle cx="630" cy="85" r="5" fill="#ffffff" stroke="#c8ff39" stroke-width="3"/>
    <g transform="translate(520, 60)">
      <rect width="100" height="22" rx="6" fill="#c8ff39"/>
      <text x="10" y="15" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#0c1410">PEAK: ₨ 184.5k</text>
    </g>

    <!-- X Axis Labels -->
    <g font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#607567">
      <text x="40" y="375">08:00</text>
      <text x="150" y="375">11:00</text>
      <text x="270" y="375">14:00</text>
      <text x="390" y="375">17:00</text>
      <text x="510" y="375">20:00</text>
      <text x="610" y="375">23:00</text>
    </g>
  </g>

  <!-- Right Sidebar: Automation & Lead Pipeline -->
  <g transform="translate(790, 290)">
    <rect width="320" height="430" rx="18" fill="#101a14" stroke="#26382c" stroke-width="1"/>
    
    <text x="24" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Automated Pipelines</text>
    <text x="24" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#758a7b">Live workflow sync status</text>

    <!-- Pipeline 1: WhatsApp Orders -->
    <g transform="translate(20, 80)">
      <rect width="280" height="65" rx="12" fill="#14211a" stroke="#2f4234" stroke-width="1"/>
      <circle cx="30" cy="32" r="14" fill="#1e3627"/>
      <text x="24" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#c8ff39">💬</text>
      <text x="56" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">WhatsApp Order Bot</text>
      <text x="56" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#c8ff39">Auto-captured 142 orders</text>
    </g>

    <!-- Pipeline 2: Google Sheets Sync -->
    <g transform="translate(20, 155)">
      <rect width="280" height="65" rx="12" fill="#14211a" stroke="#2f4234" stroke-width="1"/>
      <circle cx="30" cy="32" r="14" fill="#152e25"/>
      <text x="24" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#53bdeb">📊</text>
      <text x="56" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Google Sheets Sync</text>
      <text x="56" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8da392">Zero manual bookkeeping</text>
    </g>

    <!-- Pipeline 3: Auto Invoicing -->
    <g transform="translate(20, 230)">
      <rect width="280" height="65" rx="12" fill="#14211a" stroke="#2f4234" stroke-width="1"/>
      <circle cx="30" cy="32" r="14" fill="#1e3627"/>
      <text x="24" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#c8ff39">🧾</text>
      <text x="56" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Instant PDF Invoice</text>
      <text x="56" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#c8ff39">Sent automatically to customer</text>
    </g>

    <!-- Bottom summary badge -->
    <g transform="translate(20, 320)">
      <rect width="280" height="80" rx="12" fill="rgba(200, 255, 57, 0.08)" stroke="#c8ff39" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="20" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#c8ff39">⚡ EFFICIENCY GAIN</text>
      <text x="20" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e0ede4">25+ Hours Saved Weekly</text>
      <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8da392">Eliminated Paperwork &amp; Human Lag</text>
    </g>
  </g>
</svg>